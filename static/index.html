<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电商智能客服 Agent</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", sans-serif; background: #f5f6f8; height: 100vh; display: flex; flex-direction: column; }
  .header { background: #fff; padding: 14px 20px; border-bottom: 1px solid #e5e6eb; }
  .header h1 { font-size: 16px; color: #1f2329; }
  .header p { font-size: 12px; color: #86909c; margin-top: 2px; }
  .chat { flex: 1; overflow-y: auto; padding: 20px; max-width: 800px; width: 100%; margin: 0 auto; }
  .msg { margin-bottom: 16px; max-width: 85%; }
  .msg.user { margin-left: auto; }
  .bubble { padding: 10px 14px; border-radius: 10px; font-size: 14px; line-height: 1.7; white-space: pre-wrap; }
  .msg.user .bubble { background: #3370ff; color: #fff; }
  .msg.bot .bubble { background: #fff; border: 1px solid #e5e6eb; color: #1f2329; }
  .input-area { background: #fff; border-top: 1px solid #e5e6eb; padding: 12px 20px; }
  .input-inner { max-width: 800px; margin: 0 auto; display: flex; gap: 8px; }
  input { flex: 1; padding: 10px 14px; border: 1px solid #d0d7e5; border-radius: 8px; font-size: 14px; outline: none; }
  input:focus { border-color: #3370ff; }
  button { padding: 10px 20px; background: #3370ff; color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
  button:disabled { background: #a0c0ff; cursor: not-allowed; }
</style>
</head>
<body>
<div class="header">
  <h1>电商智能客服 Agent</h1>
  <p>基于 LangGraph 的 RAG+Agent · 支持多轮对话</p>
</div>
<div class="chat" id="chat"></div>
<div class="input-area">
  <div class="input-inner">
    <input id="question" type="text" placeholder="问我售后规则、商品推荐、订单查询，例如：7天无理由退货能退什么？" autofocus>
    <button id="send">发送</button>
  </div>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('question');
const btn = document.getElementById('send');

// 每个浏览器存一个随机 session_id，实现多轮记忆
let sessionId = localStorage.getItem('session_id');
if (!sessionId) {
  sessionId = 'user_' + Math.random().toString(36).substring(2, 10);
  localStorage.setItem('session_id', sessionId);
}

function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  div.appendChild(bubble);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function ask() {
  const q = input.value.trim();
  if (!q) return;
  input.value = '';
  btn.disabled = true;
  addMsg('user', q);
  try {
    const resp = await fetch('/agent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q, session_id: sessionId })
    });
    const data = await resp.json();
    if (!resp.ok) {
      addMsg('bot', '请求出错：' + JSON.stringify(data.detail || data));
    } else {
      addMsg('bot', data.answer);
    }
  } catch (e) {
    addMsg('bot', '网络错误：' + e.message);
  } finally {
    btn.disabled = false;
    input.focus();
  }
}

btn.onclick = ask;
input.addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });
</script>
</body>
</html>
